# Named compose.yaml (the modern Compose Specification filename) rather than
# podman-compose.yml/docker-compose.yml deliberately: it's in both
# podman-compose's and Docker's own default-file search order, so either
# tool finds it with zero -f flags and there's exactly one file to maintain.
#
# Don't add a second compose file under an alternate default name
# (docker-compose.yml, podman-compose.yml, etc.) alongside this one --
# podman-compose's default-file discovery loads and merges *every* name in
# its candidate list that exists on disk rather than picking the first
# match, so two simultaneously-present default-named files (even if one is
# just a symlink to the other) get merged with themselves, silently
# duplicating list fields like `ports`/`depends_on`. Confirmed the hard way.
#
# Usage:
#   podman-compose up --build          (or: docker compose up --build)
#   open http://localhost:8080
#
# The frontend nginx container proxies /api/* to the backend container over
# the compose-managed network, so only one port needs to be published.
# backend/Dockerfile and frontend/Dockerfile are symlinks to Containerfile
# (no equivalent multi-file hazard there -- `docker build` only ever reads
# one Dockerfile per invocation), so a plain `docker build ./backend` also
# needs no -f.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: tls-scanner-backend
    # No CORS_ALLOW_ORIGINS set: the frontend reaches the API same-origin
    # through nginx's /api proxy, so cross-origin access isn't needed. Only
    # set this if something other than the shipped frontend calls the API
    # directly from a browser.
    # Not published to the host on purpose -- only the frontend's nginx
    # reverse proxy needs to reach it, on the internal compose network.
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: tls-scanner-frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
    restart: unless-stopped
